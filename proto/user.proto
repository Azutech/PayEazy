syntax = "proto3";

package user;

message User {
    string id = 1;
    string name = 2;
    string email = 3;
    string password = 4;
    string phone = 5;
    string address = 6;
    string city = 7;
    string state = 8;
    string zip = 9;
    string country = 10;
    string created_at = 11;
    string updated_at = 12;
}
