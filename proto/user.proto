syntax = "proto3";

package user;

message User {
    string id = 1;
    string name = 2;
    string email = 3;
    string password = 4;
    string phoneNumber = 5;
    string avatar = 6;
    string dateOfBirth = 7;
    string sex = 8;
    string firstName = 9;
    string lastName = 10;
    string createdAt = 11;
    string updatedAt = 12;
}
