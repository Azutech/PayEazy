syntax = "proto3";

package user;


service UserService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}

message User {
    string id = 1;
    string name = 2;
    string email = 3;
    string password = 4;
    string phoneNumber = 5;
    string avatar = 6;
    string dateOfBirth = 7;
    string sex = 8;
    string firstName = 9;
    string lastName = 10;
    string createdAt = 11;
    string updatedAt = 12;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string phoneNumber = 3;
}

message RegisterResponse {
    string message = 1;
    User user = 2;
    string token = 3; 
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string message = 1;

}

message VerificationRequest {
  int32 code = 1;
}

message VerificationResponse {
  string message = 1;
}

message DashboardRequest {
  string userId = 1;
}

message WalletAccount {
  string id = 1;
  string type = 2;
  string currency = 3;
  double balance = 4;
}

message DashboardData {
  string id = 1;
  string email = 2;
  string phoneNumber = 3;
  string avatar = 4;
  string walletId = 5;
  repeated WalletAccount wallets_accounts = 6;
}

message DashboardResponse {
  string message = 1;
  DashboardData data = 2;
}